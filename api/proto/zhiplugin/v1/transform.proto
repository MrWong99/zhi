syntax = "proto3";

package zhiplugin.v1;

import "zhiplugin/v1/config.proto";

option go_package = "github.com/MrWong99/zhi/pkg/zhiplugin/transform/proto";

// TransformService is the gRPC interface every zhi transform plugin must
// implement.
service TransformService {
  // BeforeDisplay transforms the configuration tree before values are
  // displayed in the UI.
  rpc BeforeDisplay(BeforeDisplayRequest) returns (BeforeDisplayResponse);
  // AfterSave transforms the configuration tree after the UI stores
  // updates.
  rpc AfterSave(AfterSaveRequest) returns (AfterSaveResponse);
  // ValidatePolicy reports when config-plugin validations should run
  // relative to the transformation.
  rpc ValidatePolicy(ValidatePolicyRequest) returns (ValidatePolicyResponse);
}

// BeforeDisplayRequest carries the full configuration tree for the
// BeforeDisplay transformation.
message BeforeDisplayRequest {
  // A snapshot of the full merged configuration tree.
  repeated TreeEntry tree = 1;
}

// BeforeDisplayResponse carries the transformed configuration tree back to
// the host after the BeforeDisplay transformation.
message BeforeDisplayResponse {
  // The modified configuration tree.
  repeated TreeEntry tree = 1;
}

// AfterSaveRequest carries the full configuration tree for the AfterSave
// transformation.
message AfterSaveRequest {
  // A snapshot of the full merged configuration tree.
  repeated TreeEntry tree = 1;
}

// AfterSaveResponse carries the transformed configuration tree back to the
// host after the AfterSave transformation.
message AfterSaveResponse {
  // The modified configuration tree.
  repeated TreeEntry tree = 1;
}

// ValidatePolicyRequest is intentionally empty.
message ValidatePolicyRequest {}

message ValidatePolicyResponse {
  // 0 = ValidateBeforeTransform, 1 = ValidateAfterTransform,
  // 2 = ValidateBoth.
  int32 policy = 1;
}
