{{define "title"}}Tree{{end}}

{{define "content"}}
<div class="tree-filter">
  <input
    type="search"
    class="input"
    name="filter"
    placeholder="Filter paths..."
    value="{{.Filter}}"
    hx-get="/tree"
    hx-trigger="input changed delay:300ms, search"
    hx-target="#tree-content"
    hx-swap="innerHTML"
    hx-push-url="true"
  >
</div>

<div id="tree-content"
     hx-get="/tree"
     hx-trigger="valueChanged from:body"
     hx-swap="innerHTML">
  {{template "tree_content" .}}
</div>
{{end}}
