# Vault deployment configuration
# Generated by zhi -- do not edit manually

vault-deploy:
  mode:
    val: "docker"
    metadata:
      ui.section: "Deployment"
      ui.displayName: "Deployment Mode"
      ui.placeholder: "docker"
      core.description: "How to deploy Vault: host (local binary), docker (Docker Compose), or kubernetes."
    validation: |-
      mode, ok := v.Val.(string)
      if !ok {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "mode must be a string",
        }}, nil
      }
      switch mode {
      case "host", "docker", "kubernetes":
        return nil, nil
      default:
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "mode must be one of: host, docker, kubernetes",
        }}, nil
      }

  vault-version:
    val: "1.19.0"
    metadata:
      ui.section: "Deployment"
      ui.displayName: "Vault Version"
      ui.placeholder: "1.21.2"
      core.description: "Vault version to deploy (Docker image tag / Kubernetes image tag)."

  unseal-shares:
    val: 5
    metadata:
      ui.section: "Initialization"
      ui.displayName: "Unseal Key Shares"
      ui.placeholder: "5"
      core.description: "Number of unseal key shares to generate during Vault initialization."
      core.type: int
    validation: |-
      shares, ok := v.Val.(int)
      if !ok {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "unseal-shares must be an integer",
        }}, nil
      }
      if shares < 1 || shares > 10 {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "unseal-shares must be between 1 and 10",
        }}, nil
      }
      threshold, ok := tree.Get("vault-deploy/unseal-threshold")
      if ok {
        t, _ := threshold.Val.(int)
        if t > shares {
          return []config.ValidationResult{{
            Severity: config.Blocking,
            Message:  "unseal-shares must be >= unseal-threshold",
          }}, nil
        }
      }
      return nil, nil

  unseal-threshold:
    val: 3
    metadata:
      ui.section: "Initialization"
      ui.displayName: "Unseal Threshold"
      ui.placeholder: "3"
      core.description: "Minimum number of unseal keys required to unseal Vault."
      core.type: int
    validation: |-
      threshold, ok := v.Val.(int)
      if !ok {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "unseal-threshold must be an integer",
        }}, nil
      }
      if threshold < 1 {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "unseal-threshold must be at least 1",
        }}, nil
      }
      shares, ok := tree.Get("vault-deploy/unseal-shares")
      if ok {
        s, _ := shares.Val.(int)
        if threshold > s {
          return []config.ValidationResult{{
            Severity: config.Blocking,
            Message:  "unseal-threshold must be <= unseal-shares",
          }}, nil
        }
      }
      return nil, nil

  docker:
    port:
      val: 8200
      metadata:
        ui.section: "Docker"
        ui.displayName: "Host Port"
        ui.placeholder: "8200"
        core.description: "Host port to map to Vault's API port in Docker."
        core.type: int
      validation: |-
        port, ok := v.Val.(int)
        if !ok {
          return []config.ValidationResult{{
            Severity: config.Blocking,
            Message:  "port must be an integer",
          }}, nil
        }
        if port < 1 || port > 65535 {
          return []config.ValidationResult{{
            Severity: config.Blocking,
            Message:  "port must be between 1 and 65535",
          }}, nil
        }
        return nil, nil

    volume-name:
      val: "vault-data"
      metadata:
        ui.section: "Docker"
        ui.displayName: "Volume Name"
        ui.placeholder: "vault-data"
        core.description: "Docker named volume for Vault persistent storage."

  k8s:
    namespace:
      val: "vault"
      metadata:
        ui.section: "Kubernetes"
        ui.displayName: "Namespace"
        ui.placeholder: "vault"
        core.description: "Kubernetes namespace for the Vault deployment."

    replicas:
      val: 1
      metadata:
        ui.section: "Kubernetes"
        ui.displayName: "Replicas"
        ui.placeholder: "1"
        core.description: "Number of Vault pod replicas."
        core.type: int

    storage-class:
      val: "standard"
      metadata:
        ui.section: "Kubernetes"
        ui.displayName: "Storage Class"
        ui.placeholder: "standard"
        core.description: "Kubernetes StorageClass for Vault's PersistentVolumeClaim."

    storage-size:
      val: "10Gi"
      metadata:
        ui.section: "Kubernetes"
        ui.displayName: "Storage Size"
        ui.placeholder: "10Gi"
        core.description: "Size of the PersistentVolumeClaim for Vault storage."

    ingress-enabled:
      val: false
      metadata:
        ui.section: "Kubernetes"
        ui.displayName: "Enable Ingress"
        core.description: "Create a Kubernetes Ingress resource for external access."
        core.type: bool

    ingress-host:
      val: ""
      metadata:
        ui.section: "Kubernetes"
        ui.displayName: "Ingress Hostname"
        ui.placeholder: "vault.example.com"
        core.description: "Hostname for the Ingress resource."
      validation: |-
        host, ok := v.Val.(string)
        if !ok {
          return nil, nil
        }
        ingressEnabled, ok := tree.Get("vault-deploy/k8s/ingress-enabled")
        if !ok {
          return nil, nil
        }
        enabled, _ := ingressEnabled.Val.(bool)
        if enabled && host == "" {
          return []config.ValidationResult{{
            Severity: config.Blocking,
            Message:  "ingress-host is required when Ingress is enabled",
          }}, nil
        }
        return nil, nil

    service-type:
      val: "ClusterIP"
      metadata:
        ui.section: "Kubernetes"
        ui.displayName: "Service Type"
        ui.placeholder: "ClusterIP"
        core.description: "Kubernetes Service type: ClusterIP, NodePort, or LoadBalancer."
      validation: |-
        svcType, ok := v.Val.(string)
        if !ok {
          return []config.ValidationResult{{
            Severity: config.Blocking,
            Message:  "service-type must be a string",
          }}, nil
        }
        switch svcType {
        case "ClusterIP", "NodePort", "LoadBalancer":
          return nil, nil
        default:
          return []config.ValidationResult{{
            Severity: config.Blocking,
            Message:  "service-type must be one of: ClusterIP, NodePort, LoadBalancer",
          }}, nil
        }
