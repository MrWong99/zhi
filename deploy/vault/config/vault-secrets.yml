# Vault secret engines configuration
# Generated by zhi -- do not edit manually

vault-secrets:
  engines:
    val: "kv-v2"
    metadata:
      ui.section: "Secret Engines"
      ui.displayName: "Engines"
      ui.placeholder: "kv-v2,transit"
      core.description: "Comma-separated list of secret engines to enable."
    imports:
      - strings
    validation: |-
      engines, ok := v.Val.(string)
      if !ok {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "engines must be a string",
        }}, nil
      }
      known := map[string]bool{
        "kv-v2": true, "kv-v1": true, "transit": true,
        "pki": true, "totp": true, "ssh": true,
        "aws": true, "gcp": true, "azure": true,
        "database": true, "rabbitmq": true, "consul": true,
      }
      var results []config.ValidationResult
      for _, e := range strings.Split(engines, ",") {
        e = strings.TrimSpace(e)
        if e == "" {
          continue
        }
        if !known[e] {
          results = append(results, config.ValidationResult{
            Severity: config.Warning,
            Message:  "unknown secret engine: " + e + " (will attempt to enable anyway)",
          })
        }
      }
      return results, nil

  kv-v2-path:
    val: "secret"
    metadata:
      ui.section: "Secret Engines"
      ui.displayName: "KV v2 Mount Path"
      ui.placeholder: "secret"
      core.description: "Mount path for the KV version 2 secret engine."

  transit-path:
    val: "transit"
    metadata:
      ui.section: "Secret Engines"
      ui.displayName: "Transit Mount Path"
      ui.placeholder: "transit"
      core.description: "Mount path for the Transit encryption engine."

  pki-path:
    val: "pki"
    metadata:
      ui.section: "Secret Engines"
      ui.displayName: "PKI Mount Path"
      ui.placeholder: "pki"
      core.description: "Mount path for the PKI certificate engine."

  totp-path:
    val: "totp"
    metadata:
      ui.section: "Secret Engines"
      ui.displayName: "TOTP Mount Path"
      ui.placeholder: "totp"
      core.description: "Mount path for the TOTP engine."
