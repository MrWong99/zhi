# Vault server configuration
# Generated by zhi -- do not edit manually

vault-server:
  api-addr:
    val: "http://127.0.0.1:8200"
    metadata:
      ui.section: "Server"
      ui.displayName: "API Address"
      ui.placeholder: "http://127.0.0.1:8200"
      core.description: "The address Vault listens on for API requests."
    imports:
      - strings
      - net/url
    validation: |-
      addr, ok := v.Val.(string)
      if !ok {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "api-addr must be a string",
        }}, nil
      }
      u, err := url.Parse(addr)
      if err != nil || (u.Scheme != "http" && u.Scheme != "https") {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "api-addr must be a valid HTTP(S) URL",
        }}, nil
      }
      return nil, nil

  cluster-addr:
    val: "http://127.0.0.1:8201"
    metadata:
      ui.section: "Server"
      ui.displayName: "Cluster Address"
      ui.placeholder: "http://127.0.0.1:8201"
      core.description: "The address Vault uses for cluster communication (HA mode)."

  log-level:
    val: "info"
    metadata:
      ui.section: "Server"
      ui.displayName: "Log Level"
      ui.placeholder: "info"
      core.description: "Vault log verbosity: trace, debug, info, warn, error."
    validation: |-
      level, ok := v.Val.(string)
      if !ok {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "log-level must be a string",
        }}, nil
      }
      switch level {
      case "trace", "debug", "info", "warn", "error":
        return nil, nil
      default:
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "log-level must be one of: trace, debug, info, warn, error",
        }}, nil
      }

  storage-backend:
    val: "file"
    metadata:
      ui.section: "Server"
      ui.displayName: "Storage Backend"
      ui.placeholder: "file"
      core.description: "Vault storage backend: file, raft, or consul."
    validation: |-
      backend, ok := v.Val.(string)
      if !ok {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "storage-backend must be a string",
        }}, nil
      }
      switch backend {
      case "file", "raft", "consul":
        return nil, nil
      default:
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "storage-backend must be one of: file, raft, consul",
        }}, nil
      }

  storage-path:
    val: "/vault/data"
    metadata:
      ui.section: "Server"
      ui.displayName: "Storage Path"
      ui.placeholder: "/vault/data"
      core.description: "Filesystem path for the file or raft storage backend."

  tls:
    enabled:
      val: false
      metadata:
        ui.section: "TLS"
        ui.displayName: "Enable TLS"
        core.description: "Enable TLS for the Vault API listener."
        core.type: bool

    cert-file:
      val: ""
      metadata:
        ui.section: "TLS"
        ui.displayName: "Certificate File"
        ui.placeholder: "/path/to/cert.pem"
        core.description: "Path to the TLS certificate file."
      validation: |-
        cert, ok := v.Val.(string)
        if !ok {
          return nil, nil
        }
        tlsEnabled, ok := tree.Get("vault-server/tls/enabled")
        if !ok {
          return nil, nil
        }
        enabled, _ := tlsEnabled.Val.(bool)
        if enabled && cert == "" {
          return []config.ValidationResult{{
            Severity: config.Blocking,
            Message:  "TLS certificate file is required when TLS is enabled",
          }}, nil
        }
        return nil, nil

    key-file:
      val: ""
      metadata:
        ui.section: "TLS"
        ui.displayName: "Private Key File"
        ui.placeholder: "/path/to/key.pem"
        core.description: "Path to the TLS private key file."
      validation: |-
        key, ok := v.Val.(string)
        if !ok {
          return nil, nil
        }
        tlsEnabled, ok := tree.Get("vault-server/tls/enabled")
        if !ok {
          return nil, nil
        }
        enabled, _ := tlsEnabled.Val.(bool)
        if enabled && key == "" {
          return []config.ValidationResult{{
            Severity: config.Blocking,
            Message:  "TLS private key file is required when TLS is enabled",
          }}, nil
        }
        return nil, nil

    client-ca-file:
      val: ""
      metadata:
        ui.section: "TLS"
        ui.displayName: "Client CA File"
        ui.placeholder: "/path/to/ca.pem"
        core.description: "Path to CA certificate for mTLS client verification. Optional."

  ui:
    val: true
    metadata:
      ui.section: "Server"
      ui.displayName: "Enable Web UI"
      core.description: "Enable the Vault built-in web UI."
      core.type: bool
