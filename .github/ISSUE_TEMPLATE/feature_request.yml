name: Feature Request
description: Suggest a new feature or enhancement. Help zhi evolve!
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea that could make zhi stronger? Like teaching a
        Pokemon a new move, every great feature starts with a good
        proposal. Tell us what you have in mind!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: >
        Is your feature request related to a problem?
        Describe the pain point clearly.
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: >
        Describe the solution you'd like to see. Be as specific as you
        can -- API sketches, CLI flags, config examples, or architecture
        ideas are all welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: >
        Have you considered any alternative approaches?
        Let us know what else crossed your mind.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of zhi does this relate to?
      options:
        - CLI / TUI
        - Plugin Framework
        - Configuration Management
        - Provisioning
        - Documentation
        - Build / Tooling
        - Other
    validations:
      required: true

  - type: dropdown
    id: willing
    attributes:
      label: Would you be willing to contribute this?
      description: >
        No pressure! Just helps us understand if someone is ready to
        pick this up.
      options:
        - "Yes, I'd like to submit a PR"
        - "Maybe, with some guidance"
        - "No, just suggesting"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: >
        Any other context, mockups, references, or examples that
        would help us understand the request.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues to make sure this has not already been requested.
          required: true
