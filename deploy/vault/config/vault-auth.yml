# Vault authentication configuration
# Generated by zhi -- do not edit manually

vault-auth:
  methods:
    val: "userpass"
    metadata:
      ui.section: "Authentication"
      ui.displayName: "Auth Methods"
      ui.placeholder: "userpass,approle"
      core.description: "Comma-separated list of auth methods to enable. 'userpass' is always included."
    imports:
      - strings
    validation: |-
      methods, ok := v.Val.(string)
      if !ok {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "methods must be a string",
        }}, nil
      }
      allowed := map[string]bool{
        "userpass": true, "approle": true, "ldap": true,
        "oidc": true, "jwt": true, "cert": true,
        "github": true, "token": true,
      }
      var results []config.ValidationResult
      hasUserpass := false
      for _, m := range strings.Split(methods, ",") {
        m = strings.TrimSpace(m)
        if m == "" {
          continue
        }
        if m == "userpass" {
          hasUserpass = true
        }
        if !allowed[m] {
          results = append(results, config.ValidationResult{
            Severity: config.Warning,
            Message:  "unknown auth method: " + m + " (will attempt to enable anyway)",
          })
        }
      }
      if !hasUserpass {
        results = append(results, config.ValidationResult{
          Severity: config.Blocking,
          Message:  "userpass must be included in auth methods (required for initial admin)",
        })
      }
      return results, nil

  admin-username:
    val: "admin"
    metadata:
      ui.section: "Authentication"
      ui.displayName: "Admin Username"
      ui.placeholder: "admin"
      core.description: "Username for the initial admin user (userpass auth)."
    imports:
      - strings
    validation: |-
      username, ok := v.Val.(string)
      if !ok || strings.TrimSpace(username) == "" {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "admin-username is required",
        }}, nil
      }
      return nil, nil

  admin-password:
    val: ""
    metadata:
      ui.section: "Authentication"
      ui.displayName: "Admin Password"
      ui.placeholder: "Enter a strong password"
      ui.password: "true"
      config.required: "true"
      core.description: "Password for the initial admin user. Will be deleted from exported files after apply."
    imports:
      - strings
    validation: |-
      password, ok := v.Val.(string)
      if !ok || strings.TrimSpace(password) == "" {
        return []config.ValidationResult{{
          Severity: config.Blocking,
          Message:  "admin-password is required",
        }}, nil
      }
      if len(password) < 12 {
        return []config.ValidationResult{{
          Severity: config.Warning,
          Message:  "admin-password should be at least 12 characters for production use",
        }}, nil
      }
      return nil, nil
