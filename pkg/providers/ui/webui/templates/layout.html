<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}zhi{{end}} - zhi</title>
  <meta name="csrf-token" content="{{csrfToken .}}">
  <link rel="icon" href="{{assetPath "favicon.ico"}}" type="image/x-icon">
  <link rel="stylesheet" href="{{assetPath "css/reset.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/tokens.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/layout.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/components.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/tree.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/editor.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/validation.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/component-mgmt.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/notifications.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/export.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/apply.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/shortcuts.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/login.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/marketplace.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/polish.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/themes/light.css"}}" nonce="{{nonce .}}">
  <link rel="stylesheet" href="{{assetPath "css/themes/dark.css"}}" nonce="{{nonce .}}">
  <script src="{{assetPath "js/vendor/htmx.min.js"}}" nonce="{{nonce .}}"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{csrfToken .}}"}'>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div class="app">
    {{if .ActiveNav}}
      {{template "sidebar" .}}
      <div class="main">
        {{template "topbar" .}}
        <div class="content" id="main-content" role="main">
          {{block "content" .}}{{end}}
        </div>
      </div>
    {{else}}
      <div class="main main-full">
        <div class="content" id="main-content" role="main">
          {{block "content" .}}{{end}}
        </div>
      </div>
    {{end}}
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="{{assetPath "js/app.js"}}" nonce="{{nonce .}}"></script>
</body>
</html>
