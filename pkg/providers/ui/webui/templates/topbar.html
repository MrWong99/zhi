{{define "topbar"}}
<div class="topbar">
  <nav class="breadcrumb">
    {{if .Breadcrumbs}}
      {{range $i, $b := .Breadcrumbs}}
        {{if $i}}<span>/</span>{{end}}
        <a href="{{$b.Href}}">{{$b.Label}}</a>
      {{end}}
    {{else}}
      <span>Configuration Tree</span>
    {{end}}
  </nav>
  <div class="topbar-actions">
    <div id="unsaved-indicator" class="unsaved-indicator">
      <span class="unsaved-dot"></span>
      <span>Unsaved changes</span>
    </div>
    <button id="save-tree-btn" class="btn btn-primary btn-sm"
            hx-post="/tree/save"
            hx-swap="none"
            disabled>
      {{icon "save"}} Save
    </button>
  </div>
</div>
{{end}}
