<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}zhi{{end}} - zhi</title>
  <meta name="csrf-token" content="{{csrfToken .}}">
  <link rel="stylesheet" href="/static/css/reset.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/tokens.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/layout.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/components.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/tree.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/editor.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/validation.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/component-mgmt.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/notifications.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/shortcuts.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/themes/light.css" nonce="{{nonce .}}">
  <link rel="stylesheet" href="/static/css/themes/dark.css" nonce="{{nonce .}}">
  <script src="/static/js/vendor/htmx.min.js" nonce="{{nonce .}}"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{csrfToken .}}"}'>
  <div class="app">
    {{template "sidebar" .}}
    <div class="main">
      {{template "topbar" .}}
      <div class="content">
        {{block "content" .}}{{end}}
      </div>
    </div>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="/static/js/app.js" nonce="{{nonce .}}"></script>
</body>
</html>
