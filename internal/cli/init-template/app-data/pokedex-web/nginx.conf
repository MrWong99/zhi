# Nginx configuration, finely tuned like a Pokeflute.
server {
    listen 80;
    server_name localhost;

    # Serve the main Pokedex app
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Route to the Pokemon API service.
    # It's like a secret passage to Professor Oak's lab.
    location /api/ {
        proxy_pass http://pokemon-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to .htaccess files, if Apache's configuration files
    # somehow end up in the document root. A good defense is the best offense!
    location ~ /\.ht {
        deny  all;
    }
}
