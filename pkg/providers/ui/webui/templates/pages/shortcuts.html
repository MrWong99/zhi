{{define "title"}}Keyboard Shortcuts{{end}}

{{define "content"}}
<div class="shortcuts-page">
  <h2>Keyboard Shortcuts</h2>
  <div class="shortcuts-grid">
    <div class="shortcut-group">
      <h3>Navigation</h3>
      <div class="shortcut-row">
        <kbd>g</kbd> <kbd>t</kbd>
        <span>Go to Tree</span>
      </div>
      <div class="shortcut-row">
        <kbd>g</kbd> <kbd>c</kbd>
        <span>Go to Components</span>
      </div>
      <div class="shortcut-row">
        <kbd>g</kbd> <kbd>v</kbd>
        <span>Go to Validation</span>
      </div>
      <div class="shortcut-row">
        <kbd>g</kbd> <kbd>e</kbd>
        <span>Go to Export</span>
      </div>
      <div class="shortcut-row">
        <kbd>g</kbd> <kbd>a</kbd>
        <span>Go to Apply</span>
      </div>
    </div>
    <div class="shortcut-group">
      <h3>Actions</h3>
      <div class="shortcut-row">
        <kbd>/</kbd>
        <span>Focus filter input</span>
      </div>
      <div class="shortcut-row">
        <kbd>Ctrl</kbd>+<kbd>S</kbd>
        <span>Save tree</span>
      </div>
      <div class="shortcut-row">
        <kbd>Esc</kbd>
        <span>Close edit form / Cancel</span>
      </div>
      <div class="shortcut-row">
        <kbd>?</kbd>
        <span>Show this help</span>
      </div>
    </div>
  </div>
</div>
{{end}}
