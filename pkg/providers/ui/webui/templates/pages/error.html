{{define "title"}}Error {{.StatusCode}}{{end}}

{{define "content"}}
<div class="card" style="max-width: 600px; margin: var(--space-8) auto;">
  <div class="card-body" style="text-align: center; padding: var(--space-8);">
    <h2 style="font-size: var(--text-2xl); margin-bottom: var(--space-2);">{{.StatusCode}}</h2>
    <p style="color: var(--color-text-secondary); margin-bottom: var(--space-6);">{{.StatusText}}</p>
    {{if .Message}}
      <p class="mono" style="color: var(--color-danger); margin-bottom: var(--space-6);">{{.Message}}</p>
    {{end}}
    <a href="/tree" class="btn btn-primary">Back to Tree</a>
  </div>
</div>
{{end}}
