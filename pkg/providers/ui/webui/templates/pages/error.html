{{define "title"}}Error {{.StatusCode}}{{end}} {{define "content"}}
<div class="card error-page">
    <div class="card-body">
        <img src="{{assetPath "mascot.svg"}}" alt="" class="error-page-mascot" width="64" height="64">
        <h2 class="error-page-code">{{.StatusCode}}</h2>
        <p class="error-page-status">{{.StatusText}}</p>
        {{if .Message}}
        <p class="mono error-page-message">{{.Message}}</p>
        {{end}}
        <a href="/tree" class="btn btn-primary">Back to Tree</a>
    </div>
</div>
{{end}}
